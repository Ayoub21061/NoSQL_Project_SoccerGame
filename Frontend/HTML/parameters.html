<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account's settings - Soccer Game</title>
  <link rel="stylesheet" href="../css/menu.css">
  <link rel="stylesheet" href="../css/parameters.css">
</head>
<body>

  <!-- Sidebar -->
  <div id="mySidebar" class="sidebar">
    <span class="closebtn">&times;</span>
    <a href="dashboard.html">Dashboard</a>
    <a href="achievements.html">Achievements</a>
    <a href="games.html">Games</a>
    <a href="equipe.html">Team</a>
    <a href="skills.html">Player's Shop</a>
    <a href="contrats_formes.html">Item's Shop</a>
    <a href="my_packs.html">My Packs</a>
    <a href="battlepass.html">Battle Pass</a>
    <a href="social.html">Amis</a>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="left">
      <div class="hamburger">&#9776;</div>
    </div>
    <div class="center">
      <h1>Account's settings</h1>
    </div>
    <div class="right"></div>
  </header>

  <!-- Main content -->
  <main class="settings-container">
    
    <!-- Section gauche : profil -->
    <section class="profile-section">
      <h2>User's profil</h2>

      <!-- Avatar -->
      <div class="avatar-container">
        <img id="avatar-preview" src="../images/default-avatar.png" alt="Avatar joueur">
        <label for="avatar-upload" class="btn">Change avatar</label>
        <input type="file" id="avatar-upload" accept="image/*" hidden>
      </div>

      <!-- Sélection d'avatars prédéfinis -->
      <div class="avatar-selection">
        <h3>Or choose a predefined avatar</h3>
        <div class="avatar-grid">
          <img src="../images/Luffay.png" class="preset-avatar" alt="avatar1">
          <img src="../images/mahrez.png" class="preset-avatar" alt="avatar2">
          <img src="../images/fernandes.png" class="preset-avatar" alt="avatar3">
          <img src="../images/cristiano.png" class="preset-avatar" alt="avatar4">
          <img src="../images/casemiro.png" class="preset-avatar" alt="avatar5">
          <img src="../images/bellingham.png" class="preset-avatar" alt="avatar6">
          <img src="../images/messi.png" class="preset-avatar" alt="avatar7">

        </div>
      </div>

      <!-- Infos joueur -->
      <div class="info-group">
        <label for="username">Pseudo :</label>
        <input type="text" id="username" placeholder="Votre pseudo">
      </div>

      <div class="info-static">
        <p><strong>Email :</strong> <span id="user-email"> </span></p>
        <p><strong>Creation date :</strong> <span id="creation-date">--/--/----</span></p>
        <p><strong>Total playtime :</strong> <span id="playtime">--/--/----</span></p>
      </div>

      <button class="btn primary" id="save-profile">Save</button>
    </section>

    <!-- Section droite : sécurité -->
    <section class="security-section">
      <h2>Security</h2>

      <div class="info-group">
        <label for="old-password">Old password :</label>
        <input type="password" id="old-password" placeholder="••••••••">
      </div>

      <div class="info-group">
        <label for="new-password">New password :</label>
        <input type="password" id="new-password" placeholder="••••••••">
      </div>

      <button class="btn primary" id="update-password">Update password</button>

      <hr>

      <button class="btn danger" id="delete-account">Delete account</button>
    </section>

    <a class="btn_deconn" href="index.html">Disconnect</a>
  </main>

  <script src="../js/menu.js"></script>
  <script src="../js/parameters.js"></script>
</body>
</html>
