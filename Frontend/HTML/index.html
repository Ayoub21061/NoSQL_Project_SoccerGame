<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soccer Game - Connexion</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h1>Soccer Game</h1>

        <div id="login-form">
            <h2>Connection</h2>
            <input type="text" id="login-username" placeholder="Nom d'utilisateur">
            <input type="password" id="login-password" placeholder="Mot de passe">
            <button onclick="login()">Log in</button>
            <p>Don't have an account yet? <span onclick="showRegister()">Create an account</span></p>
        </div>

        <div id="register-form" style="display:none;">
            <h2>Create an account</h2>
            <input type="text" id="register-username" placeholder="Nom d'utilisateur">
            <input type="text" id="register-email" placeholder="Adresse email">
            <input type="password" id="register-password" placeholder="Mot de passe">
            <input type="password" id="register-password-confirm" placeholder="Confirmer le mot de passe">
            <button onclick="register()">Create</button>
            <p>Already have an account ? <span onclick="showLogin()">Log in</span></p>
        </div>
    </div>

    <script src="../js/main.js"></script>
</body>
</html>
