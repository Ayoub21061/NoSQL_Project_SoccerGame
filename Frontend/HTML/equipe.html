<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Mon Équipe</title>
  <link rel="stylesheet" href="../css/equipe.css">
  <link rel="stylesheet" href="../css/menu.css">
  <link rel="stylesheet" href="../css/contracts_forms.css">


</head>

<body>
  <header class="header">
    <div class="left">
      <span class="hamburger">&#9776;</span>
    </div>
    <div class="center">
      <h1>My team</h1>
    </div>

    <nav>
      <ul>
        <li><a href="skills.html">Back to player's shop</a></li>
      </ul>
    </nav>

    <div class="right user-info">
        <a href="parameters.html" class="profil">
            <img id="user-avatar" src="../images/default-avatar.png" alt="Avatar Joueur" class="avatar">
            <div class="profile-text">
            <span id="user-name">Player</span>
            
            </div>
        </a>
        <span id="user-credits">💰 Crédits : 0</span>
        </div>
    </div>

  </header>

  <!-- Sidebar -->
  <div id="mySidebar" class="sidebar">
    <span class="closebtn">&times;</span>
    <a href="dashboard.html">Dashboard</a>
    <a href="achievements.html">Achievements</a>
    <a href="games.html">Games</a>
    <a href="equipe.html">Team</a>
    <a href="skills.html">Player's Shop</a>
    <a href="contrats_formes.html">Item's Shop</a>
    <a href="my_packs.html">My Packs</a>
    <a href="battlepass.html">Battle Pass</a>
    <a href="social.html">Amis</a>
  </div>

  <div id="team-chemistry">Collective: 0%</div>
  
  <main>
    <section id="team-section">
      <label for="formation">Choose training :</label>
      <select id="formation">
        <option value="4-4-2">4-4-2</option>
        <option value="4-3-3">4-3-3</option>
      </select>

      <div id="team-container">
        <!-- Formation dynamique -->
      </div>
    </section>

    <aside id="players-list">
      <h2>Players purchased</h2>
      <div class="player-cards-container">
        <!-- Joueurs achetés horizontaux -->
      </div>
    </aside>



    <h2 class="section-title">Items purchased</h2>
    <div id="contracts-forms-container" class="items-container"></div>
    
    <h2 class="section-title">Maillots obtenus</h2>
    <div id="kits-container" class="items-container">
      <!-- Maillots du Battle Pass -->
    </div>



  </main>

  <script src="../js/equipe.js"></script>
  <script src="../js/menu.js"></script>

</body>

</html>
