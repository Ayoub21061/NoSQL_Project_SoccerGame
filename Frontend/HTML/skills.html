<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player's shop</title>
  <link rel="stylesheet" href="../css/skills.css" />
  <link rel="stylesheet" href="../css/menu.css" />
</head>

<body>
  <header class="header">
    <div class="left">
      <div class="hamburger">&#9776;</div>
    </div>

    <div class="center">
      <h1>Player's shop</h1>
    </div>

    <div class="right user-info">
      <a href="parameters.html" class="profil">
        <img id="user-avatar" src="../images/default-avatar.png" alt="Avatar Joueur" class="avatar">
        <div class="profile-text">
          <span id="user-name">Player</span>

        </div>
      </a>
      <span id="user-credits">💰 Crédits : 0</span>
    </div>

  </header>

  <!-- Sidebar -->
  <div id="mySidebar" class="sidebar">
    <span class="closebtn">&times;</span>
    <a href="dashboard.html">Dashboard</a>
    <a href="achievements.html">Achievements</a>
    <a href="games.html">Games</a>
    <a href="equipe.html">Team</a>
    <a href="skills.html">Player's Shop</a>
    <a href="contrats_formes.html">Item's Shop</a>
    <a href="my_packs.html">My Packs</a>
    <a href="battlepass.html">Battle Pass</a>
    <a href="social.html">Amis</a>
  </div>

  <main>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="🔍 Rechercher un joueur..." />
    </div>

    <div class="filters">
      <select id="sort-select">
        <option value="default">-- Sort by --</option>
        <option value="alpha-asc">Alphabetical order (A → Z)</option>
        <option value="price-asc">Increasing price 💰</option>
        <option value="price-desc">Decreasing price 💰</option>
      </select>
    </div>

    <div id="skills-container"></div>
  </main>

  <footer>
    <a href="equipe.html" class="team-link">Go to my team ⚽</a>
  </footer>

  <script src="../js/skills.js"></script>
  <script src="../js/menu.js"></script>
</body>

</html>
